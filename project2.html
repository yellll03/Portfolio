<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="photos/favicon.ico" type="image/x-icon" />
  <title>LuxeShip Booking Workflow</title>
  <link rel="stylesheet" href="css/project2.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <h1 class="logo">LuxeShip</h1>
    <div id="scroll-progress"></div>
  </header>

  <section class="landing">
    <h1>Passenger Booking Workflow</h1>
    <p>Sail between Odiongan and Batangas with a guided booking process.</p>
    <button class="btn-landing" id="go-to-booking">Book Now</button>
  </section>

  <main class="container" id="booking-section">
    <div class="progress-bar">
      <div class="step active" id="step1">1. Passenger Info</div>
      <div class="step" id="step2">2. Travel Details</div>
      <div class="step" id="step3">3. Review</div>
    </div>

    <form id="booking-form">
      <div class="form-step" id="form-step-1">
        <h2>Passenger Information</h2>
        <label>Full Name: <input type="text" id="name" required /></label>
        <label>Age: <input type="number" id="age" required /></label>
        <label>Gender:
          <select id="gender" required>
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </label>
        <label>Email: <input type="email" id="email" required /></label>
        <button type="button" id="next1" class="btn">Next</button>
      </div>

      <div class="form-step hidden" id="form-step-2">
        <h2>Travel Details</h2>
        <label>From:
          <select id="from" required>
            <option value="">Select</option>
            <option value="Odiongan">Odiongan</option>
            <option value="Batangas">Batangas</option>
          </select>
        </label>
        <label>To: <input type="text" id="to" readonly /></label>
        <label>Date: <input type="date" id="date" required /></label>
        <label>Departure Time:
          <select id="time" required>
            <option value="">Select</option>
            <option value="3:00 PM">3:00 PM</option>
            <option value="5:00 PM">5:00 PM</option>
          </select>
        </label>
        <label>Class:
          <select id="class" required>
            <option value="">Select</option>
            <option value="Super Value">Super Value - PHP 700</option>
            <option value="Tourist">Tourist - PHP 900</option>
            <option value="Cabin">Cabin - PHP 1200</option>
            <option value="Suite">Suite - PHP 1500</option>
          </select>
        </label>
        <label>Total Fare: <input type="text" id="fare" readonly /></label>

        <div class="button-group">
          <button type="button" id="back1" class="btn-alt">Back</button>
          <button type="button" id="next2" class="btn">Next</button>
        </div>
      </div>

      <div class="form-step hidden" id="form-step-3">
        <h2>Review and Confirm</h2>
        <div id="review-summary"></div>

        <div class="button-group">
          <button type="button" id="back2" class="btn-alt">Back</button>
          <button type="submit" id="confirm" class="btn">Confirm Booking</button>
          <button type="button" id="cancel" class="btn-cancel">Cancel</button>
        </div>
      </div>
    </form>
  </main>

  <div id="receipt-modal" class="modal hidden">
    <div class="modal-content">
      <span id="close-modal">&times;</span>
      <h3>Booking Receipt</h3>
      <p id="receipt-text"></p>
      <img id="qr-code" alt="Generated QR code for booking receipt" />
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 LuxeShip Booking Workflow.</p>
    <a href="projects.html" class="back-link">Back to Projects</a>
  </footer>

  <script src="js/project2.js"></script>
</body>
</html>
